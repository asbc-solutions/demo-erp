name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab — redeploys main without a new commit.
  workflow_dispatch:

jobs:
  # ─── CI: Lint & Type Check ───────────────────────────────────────────────
  ci:
    name: CI — Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ─── CD: Deploy to Production ────────────────────────────────────────────
  # Runs on every push to main (a merged PR is a push) and on manual dispatch.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 40
    # One deploy at a time; a newer push waits instead of building alongside.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # The default is 10m, which a cold `next build` on the server can exceed.
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Pulling latest code..."
            git pull --ff-only origin main
            git log -1 --oneline

            echo "==> Writing .env file..."
            cat > .env <<'EOF'
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXT_PUBLIC_ERP_API_URL=${{ secrets.NEXT_PUBLIC_ERP_API_URL }}
            EOF

            # Build while the old container keeps serving; it is only replaced once the
            # new image builds, so a failed build leaves the current version live.
            echo "==> Building and restarting containers..."
            docker compose up -d --build --wait --wait-timeout 180 || {
              echo "==> New container failed to become healthy. Recent logs:"
              docker compose logs --tail=100 app
              exit 1
            }

            echo "==> Cleaning up unused Docker images..."
            docker image prune -f

            echo "==> Deploy complete!"
