name: release
# Build once, deploy that image (DEPLOYMENT_PLAYBOOK Part 4, infra repo asbc-solutions/infra).
#   push to main  → build ghcr.io/asbc-solutions/demo-erp:<sha>, then deploy that image to production
#   rollback      → asbc-solutions/infra: Actions → deploy → Run workflow with an older commit SHA
# Needs one secret: INFRA_TOKEN (fine-grained PAT on asbc-solutions/infra, Actions: read and write).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/asbc-solutions/demo-erp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the production deploy in asbc-solutions/infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::secret INFRA_TOKEN is missing (fine-grained PAT on asbc-solutions/infra, Actions: read and write)"; exit 1; }
          # REST dispatch needs only Actions: write on infra (`gh workflow run` also needs Contents: read)
          gh api -X POST repos/asbc-solutions/infra/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[app]=demo" -f "inputs[env]=production" -f "inputs[tag]=$GITHUB_SHA"
          echo "Follow it: https://github.com/asbc-solutions/infra/actions/workflows/deploy.yml"
