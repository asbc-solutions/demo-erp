name: release
# Build once, promote by tag (DEPLOYMENT_PLAYBOOK Part 4, infra repo asbc-solutions/infra).
#   push to main  → build ghcr.io/asbc-solutions/demo-erp:<sha> (no deploy: there is no staging server yet)
#   push tag v*   → deploy that commit's image to production (no rebuild)
# Needs one secret: INFRA_TOKEN (fine-grained PAT on asbc-solutions/infra, Actions: read and write).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/asbc-solutions/demo-erp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the production deploy in asbc-solutions/infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          gh workflow run deploy.yml -R asbc-solutions/infra -f app=demo -f env=production -f tag="$GITHUB_SHA"
          echo "Follow it: https://github.com/asbc-solutions/infra/actions/workflows/deploy.yml"
